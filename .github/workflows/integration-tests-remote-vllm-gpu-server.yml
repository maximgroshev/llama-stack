name: "[Self-Hosted runner] Integration Tests running agains a vLLM Inference Server of a specific version"

on:
  workflow_dispatch: # Only triggering workflow manually.
    inputs:

      model:
        description: Model to serve by vLLM Inference Server
        required: true
        default: meta-llama/Llama-3.2-3B-Instruct

      vllm-server-ip:
        description: IP address of the vLLM Inference Server
        required: false
        default: "0.0.0.0"

      server-timeout:
        description: Time to wait for server to come online
        required: true
        default: "300"

      test-all-client-versions:
        description: 'Test against both the latest and published versions'
        type: boolean
        default: false

jobs:
  run_inference_tests:

    strategy:
      fail-fast: false
      max-parallel: 1 # Run tests sequentially to make sure integration tests are executed agains vLLM Inference Server of different versions
      matrix:
        # vllm-version: [v0.9.1, v0.9.2, v0.10.0]
        vllm-version: [latest]

    uses: ./.github/workflows/integration-tests-remote-vllm-gpu-server_reusable.yml
    with:
      vllm-version: ${{ matrix.vllm-version }}
      model: ${{ inputs.model }}
      vllm-server-ip: ${{ inputs.vllm-server-ip }}
      server-timeout: ${{ inputs.server-timeout }}
      test-all-client-versions: ${{ inputs.test-all-client-versions }}
    secrets:
      huggingface-pat: ${{ secrets.HF_PAT }}
