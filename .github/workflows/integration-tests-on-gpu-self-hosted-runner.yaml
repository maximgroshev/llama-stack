name: "[Self-Hosted runner] Integration Tests vLLM Inference Server"

on:
  workflow_dispatch: # Only triggering workflow manually.
    inputs:

      model:
        description: Model to serve by vLLM Inference Server
        required: true
        default: meta-llama/Llama-3.2-3B-Instruct

      vllm_server_ip:
        description: IP address of the vLLM Inference Server
        required: true
        default: "0.0.0.0"

#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]
#     paths:
#       - 'llama_stack/**'
#       - 'tests/integration/**'
#       - 'uv.lock'
#       - 'pyproject.toml'
#       - 'requirements.txt'
#       - '.github/workflows/integration-tests.yml' # This workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    # runs-on: ubuntu-latest
    runs-on: [self-hosted, linux, X64]
    strategy:
      matrix:
        # Listing tests manually since some of them currently fail
        # TODO: generate matrix list from tests/integration when fixed
        # test-type: [agents, inference, datasets, inspect, scoring, post_traaining, providers, tool_runtime, vector_io]
        test-type: [inference]
        client-type: [library]
        # client-type: [library, http]
        # python-version: ["3.12", "3.13"]
        python-version: ["3.12"]
      fail-fast: false # we want to run all tests regardless of failure

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "[DEBUG] shell debugging commands"
        run: |
          echo "All Env vars: "
          env
          echo "USER: $USER"

      - name: Setup vllm
        uses: ./.github/actions/setup-vllm
        with:
          model: ${{github.event.inputs.model }}
          huggingface_pat: ${{ secrets.HF_PAT }}

      - name: Verify VLLM remote server is healthy
        run: |
          echo "Verifying vLLM status..."
          vllm_status=$(curl -s -o /dev/null -w "%{http_code}" http://${{ github.event.inputs.vllm_server_ip }}:8000/health)
          echo "vLLM remote server /health status: $vllm_status"
          if [ "$vllm_status" != "200" ]; then
            echo "vLLM health check failed"
            exit 1
          fi

